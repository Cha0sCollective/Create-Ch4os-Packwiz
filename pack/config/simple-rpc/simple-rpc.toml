# Uses Simple RPC's existing Discord application and Minecraft image.
# This sets activity details, not the Discord application's top-level name.
# Players can set enabled = false; Packwiz preserves this preference file.
[general]
applicationID = "762726289341677668"
enabled = true
debugging = false
launcherIntegration = false
rpcImageServer = false
rpcImageServerUrl = "https://rpcavatar.firstdark.dev"
version = 27

[init]
enabled = true

[[init.presence]]
type = "PLAYING"
description = "Creating Ch4oS"
state = "Starting Minecraft"
largeImageKey = ["mclogonew"]
largeImageText = "Create: Ch4oS"
